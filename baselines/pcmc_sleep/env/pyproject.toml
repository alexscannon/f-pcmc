#: T17 GPU environment for the sleep-retrained PCMC baseline — SEPARATE from
#: the repo root project (which pins CPU-only torch 2.11.0 and py 3.14; never
#: mix the two). Recreates the Phase 0.2-validated recipe exactly; versions
#: are the ones the smoke + geometry spike ran under (recorded 2026-07-14).
#: Upstream's requirements.txt is an unusable machine freeze — ignore it.
[project]
name = "pcmc-sleep-env"
version = "0.1.0"
description = "GPU env (RTX 3090, CUDA 12.1) for baselines/pcmc_sleep/driver.py"
requires-python = "==3.11.*"
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    # torchmetrics is an UNDOCUMENTED upstream import (pcmc_layer.py:20);
    # pinned explicitly rather than relied on as a transitive dep of lightly.
    "torchmetrics==1.9.0",
    "lightly==1.5.25",
    "pykeops==2.3",
    "numba==0.66.0",
    "scipy==1.17.1",
    "scikit-learn==1.9.0",
    "matplotlib==3.11.0",
    "tqdm==4.68.4",
    "hydra-core==1.3.4",
    "omegaconf==2.3.1",
    "pyyaml==6.0.3",
    "seaborn==0.13.2",
    "pandas==3.0.3",
    "numpy==2.4.4",
    "pillow==12.2.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
